aid: viso
name: VISO
description: >-
  viso.ai builds Visual General Intelligence, a new kind of computer vision that
  understands any scene out of the box without data collection, annotation, or
  per-question retraining. The company ships two products: Viso Suite, an
  industry- and hardware-agnostic no-code/low-code cloud platform to build,
  deploy, scale, and operate real-world computer vision applications; and Viso
  Now, an agentic computer vision platform whose vision agents connect a camera
  feed, recognize the scene, write the detection logic, and wire the alerts on
  auto-pilot. Viso Now plugs into the cameras and video systems teams already
  run through ready-made connectors, then pushes outputs anywhere: alerts to
  Slack, Teams, or email, and media forwarded into any ERP, BI tool, or
  third-party system over a direct API. The Viso Now backend is exposed as an
  authenticated Apollo GraphQL API at now.viso.ai with Google sign-in.
